# ============================================================================
# Redis Configuration for School Management System
# Reference: LESSONS_LEARNED.md [D-008]
# ============================================================================

# Maximum memory allocation
maxmemory 256mb

# Eviction policy: Remove least recently used keys when memory limit is reached
# Reference: LESSONS_LEARNED.md [D-008] - allkeys-lru recommended
maxmemory-policy allkeys-lru

# Persistence Configuration
# Enable both AOF (Append-Only File) and RDB (snapshots) for durability
# Reference: LESSONS_LEARNED.md [D-003]

# AOF Configuration
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Configuration
save 900 1      # Save after 900 seconds if at least 1 key changed
save 300 10     # Save after 300 seconds if at least 10 keys changed
save 60 10000   # Save after 60 seconds if at least 10000 keys changed

# Database configuration
databases 16    # Support multiple databases (0 for student-service, 1 for configuration-service)

# Network configuration
bind 0.0.0.0
protected-mode no
port 6379
timeout 0
tcp-keepalive 300

# Logging
loglevel notice
logfile ""

# Performance tuning
maxclients 10000
tcp-backlog 511

# Memory management
maxmemory-samples 5

# Lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""
